[project]
name = "beir-openai-embeddings"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tqdm>=4.67.1",
    "requests>=2.32.3",
    "ironcore-alloy>=0.11.2",
    "tiktoken>=0.9.0"
]

# [project.scripts]
# save = "save_embeddings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "ruff>=0.9.7",
    # these were all necessary to move the uv build forward, they aren't needed for the actual
    # project
    "hatchling>=1.27.0",
    "editables>=0.5",
    "libcst>=1.6.0",
    "pyproject-hooks>=1.2.0"
]

